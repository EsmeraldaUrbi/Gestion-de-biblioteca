<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Diagrama de casos de uso del Sistema de Gestión de Biblioteca</title>
<desc id="desc">Estudiante y Docente consultan catálogo y disponibilidad y solicitan préstamos. Bibliotecario gestiona usuarios, libros, ejemplares y sanciones, y registra préstamos y devoluciones. Se muestran validaciones obligatorias y sanción por retraso condicional.</desc>
<defs>
  <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 4.5 L 1 8" fill="none" stroke="#60748a" stroke-width="1.7"/></marker>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#16324d}
  .title{font-size:27px;font-weight:700}
  .sub{font-size:15px;fill:#53687c}
  .boundary{fill:#fff;stroke:#58718b;stroke-width:2}
  .system{font-size:22px;font-weight:700}
  .section{font-size:13px;font-weight:700;letter-spacing:1px;fill:#55718f}
  .case{fill:#f4f9ff;stroke:#24547c;stroke-width:2}
  .validation{fill:#f8fbfd;stroke:#637f96;stroke-width:1.8}
  .conditional{fill:#fff9ed;stroke:#a67729;stroke-width:1.8}
  .case-text{font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
  .actor{stroke:#16324d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .actor-name{font-size:18px;font-weight:700;text-anchor:middle}
  .assoc{stroke:#7d91a3;stroke-width:1.8;fill:none}
  .relation{stroke:#60748a;stroke-width:1.9;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
  .rel-label{font-size:13px;font-weight:700;fill:#4e657b;text-anchor:middle}
  .small{font-size:13px;fill:#526b80;text-anchor:middle}
  .footer{font-size:14px;fill:#526b80}
</style>
<rect width="1600" height="980" fill="#f5f7fa"/>
<text class="title" x="64" y="43">Diagrama de casos de uso</text>
<text class="sub" x="1535" y="42" text-anchor="end">Issue #5 · Documentación 1.1</text>
<rect class="boundary" x="310" y="69" width="1000" height="839" rx="8"/>
