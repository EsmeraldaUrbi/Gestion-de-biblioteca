<path d="M345 121 H1275" stroke="#dbe5ed" stroke-width="1.5"/>
<text class="section" x="560" y="149" text-anchor="middle">ESTUDIANTE Y DOCENTE</text>
<text class="section" x="1050" y="149" text-anchor="middle">BIBLIOTECARIO</text>

